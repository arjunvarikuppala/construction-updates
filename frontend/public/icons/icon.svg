<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#0B1728" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D98B12" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="112" fill="url(#navyGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6" />
  
  <!-- Stylized Geometric Construction / Skyscraper Framing -->
  <g transform="translate(64, 76)">
    <!-- Main tower outline -->
    <path d="M70 340 L70 120 L160 60 L250 120 L250 340 Z" fill="none" stroke="white" stroke-width="18" stroke-linejoin="round" />
    <path d="M160 60 L160 340" stroke="white" stroke-width="14" stroke-linecap="round" />
    
    <!-- Floor trusses -->
    <line x1="70" y1="180" x2="250" y2="180" stroke="rgba(255,255,255,0.7)" stroke-width="12" />
    <line x1="70" y1="260" x2="250" y2="260" stroke="rgba(255,255,255,0.7)" stroke-width="12" />
    
    <!-- Cross bracings -->
    <line x1="70" y1="180" x2="160" y2="260" stroke="rgba(255,255,255,0.4)" stroke-width="8" />
    <line x1="160" y1="180" x2="250" y2="260" stroke="rgba(255,255,255,0.4)" stroke-width="8" />
    <line x1="160" y1="260" x2="70" y2="340" stroke="rgba(255,255,255,0.4)" stroke-width="8" />
    <line x1="160" y1="260" x2="250" y2="340" stroke="rgba(255,255,255,0.4)" stroke-width="8" />

    <!-- Construction Crane Arm in Brand Amber -->
    <path d="M160 60 L160 20 L330 20" fill="none" stroke="url(#amberGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="160" y1="20" x2="310" y2="50" stroke="url(#amberGrad)" stroke-width="8" />
    <line x1="240" y1="20" x2="160" y2="50" stroke="url(#amberGrad)" stroke-width="8" />
    
    <!-- Crane Hook & Cable -->
    <line x1="310" y1="20" x2="310" y2="120" stroke="#F5A623" stroke-width="8" stroke-dasharray="8 6" />
    <circle cx="310" cy="130" r="14" fill="#F5A623" />
    
    <!-- Ground Line -->
    <line x1="30" y1="340" x2="350" y2="340" stroke="url(#amberGrad)" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
